# Canonique en anglais. `lab.fr.yaml` surcharge titre et description.
id: pg-05-sauvegarder
title: "Back up a database logically, and prove the backup restores"
description: |
  Produce a custom-format dump, capture the cluster-global roles that
  `pg_dump` leaves out, then restore into a verification database and compare
  it with the original. Graded on the restored content, not on a file's
  existence: an untested backup is not a backup.
section: niveau-1
level: niveau-1
lab_type: lab
difficulty: intermediate
estimated_time: "35m"
skills:
  - postgresql
  - sauvegarde
  - restauration
  - exploitation
distros:
  - debian13
doc_url: https://www.stephane-robert.info/docs/services/bdd/relationnelles/postgresql/sauvegarde-restauration/
certification_tags: []
runtime:
  type: vm
  targets:
    - name: db1
      host: db1.lab
      label_en: "Debian 13"
      label_fr: "Debian 13"
  default: db1
validation:
  functional: true
  security: false
  persistence_after_reboot: false
