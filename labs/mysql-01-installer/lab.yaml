# Canonique en anglais. `lab.fr.yaml` surcharge titre et description.
id: mysql-01-installer
title: "Install MySQL 8.4 LTS, and close the door the packages leave open"
description: |
  Install MySQL 8.4 LTS from the Oracle repository, with its key checked, then
  restrict what it listens on. Graded on the REAL listening state read with
  `ss`, not on a configuration file: the Oracle packages ship no
  `bind-address` at all, the variable defaults to `*`, and `bind-address`
  alone does not restrict port 33060, which has its own variable.
section: mysql-niveau-1
level: mysql-niveau-1
lab_type: lab
difficulty: beginner
estimated_time: "35m"
skills:
  - mysql
  - installation
  - securite
distros:
  - debian13
doc_url: https://www.stephane-robert.info/docs/services/bdd/relationnelles/mysql/installation/
certification_tags: []
runtime:
  type: vm
  targets:
    - name: db1
      host: db1.lab
      label_en: "Debian 13"
      label_fr: "Debian 13"
  default: db1
validation:
  functional: true
  security: true
  persistence_after_reboot: false
