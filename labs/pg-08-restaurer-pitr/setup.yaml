---
# Joué par `dsoxlab run` avant d'ouvrir la session.
#
# CE SETUP NE PRÉPARE PAS UN EXERCICE : IL FABRIQUE UN INCIDENT
#
# Il déroule, dans l'ordre, exactement ce que le scénario raconte :
#
#   1. une instance avec l'archivage continu en place et une table de cinq
#      lignes ;
#   2. une SAUVEGARDE PHYSIQUE prise à ce moment-là, qui ne connaît donc que
#      ces cinq lignes ;
#   3. une sixième ligne insérée APRÈS la sauvegarde : elle n'existe que dans
#      les journaux, et c'est elle qui interdit de se contenter de restaurer la
#      copie physique ;
#   4. l'instant de sécurité, relevé et laissé à l'apprenant ;
#   5. trois secondes d'attente, pour que la cible soit franchement antérieure
#      à la catastrophe ;
#   6. le DROP TABLE, puis un dernier basculement de segment pour que le
#      journal qui le contient soit archivé lui aussi.
#
# L'ORDRE EST LE SUJET DU LAB. Inverser 2 et 3 rendrait la sauvegarde physique
# suffisante, et le lab n'enseignerait plus rien.
- name: Préparer le lab pg-08-restaurer-pitr
  hosts: lab_target
  become: true
  vars:
    majeure: "18"
    role_applicatif: appli
    mot_de_passe: "Ch4ngeMoi!2026"
    base: facturation
    schema: appli
    archives: /var/lib/postgresql/wal_archive
    sauvegardes: /var/lib/postgresql/backups
    basebackup: /var/lib/postgresql/backups/base
    instant: /home/student/instant-de-securite.txt
  tasks:

    - name: Installer gnupg pour contrôler l'empreinte de la clé
      ansible.builtin.apt:
        name: gnupg
        state: present
        update_cache: true

    - name: Récupérer la clé du dépôt PGDG
      ansible.builtin.get_url:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        dest: /etc/apt/keyrings/pgdg.asc
        mode: "0644"

    - name: Déclarer le dépôt PGDG, lié à sa clé
      ansible.builtin.deb822_repository:
        name: pgdg
        types: deb
        uris: https://apt.postgresql.org/pub/repos/apt
        suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
        components: main
        signed_by: /etc/apt/keyrings/pgdg.asc
        state: present

    - name: Installer PostgreSQL {{ majeure }}
      ansible.builtin.apt:
        name: "postgresql-{{ majeure }}"
        state: present
        update_cache: true

    # ── Effacer toute trace d'un passage précédent ───────────────────────
    #
    # Un répertoire restauré, une archive ou une sauvegarde laissés derrière
    # rendraient le lab vert sans travail, ou le rendraient insoluble.
    - name: Arrêter le serveur avant de toucher à ses répertoires
      ansible.builtin.systemd:
        name: "postgresql@{{ majeure }}-main"
        state: stopped
      failed_when: false

    - name: Effacer archive, sauvegarde et répertoire écarté d'un passage précédent
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ archives }}"
        - "{{ basebackup }}"
        - "/var/lib/postgresql/{{ majeure }}/main_damaged"
        - "/var/lib/postgresql/{{ majeure }}/main/recovery.signal"
        - "{{ instant }}"

    - name: Retirer les paramètres de restauration d'un passage précédent
      ansible.builtin.lineinfile:
        path: "/etc/postgresql/{{ majeure }}/main/postgresql.conf"
        regexp: "^#?{{ item }}"
        state: absent
      loop:
        - restore_command
        - recovery_target_time
        - recovery_target_action

    - name: Effacer ce qu'un ALTER SYSTEM aurait laissé
      ansible.builtin.copy:
        dest: "/var/lib/postgresql/{{ majeure }}/main/postgresql.auto.conf"
        owner: postgres
        group: postgres
        mode: "0600"
        content: |
          # Do not edit this file manually!
          # It will be overwritten by the ALTER SYSTEM command.

    # ── 1. L'archivage continu, en place AVANT la sauvegarde ─────────────
    - name: Poser le répertoire d'archive, au compte du serveur
      ansible.builtin.file:
        path: "{{ archives }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: Poser le répertoire parent des sauvegardes
      ansible.builtin.file:
        path: "{{ sauvegardes }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: Activer l'archivage dans la configuration
      ansible.builtin.lineinfile:
        path: "/etc/postgresql/{{ majeure }}/main/postgresql.conf"
        regexp: "^#?{{ item.cle }}"
        line: "{{ item.cle }} = {{ item.valeur }}"
      loop:
        - { cle: archive_mode, valeur: "on" }
        - { cle: archive_command, valeur: "'test ! -f {{ archives }}/%f && cp %p {{ archives }}/%f'" }
      loop_control:
        label: "{{ item.cle }}"

    - name: Démarrer le cluster avec l'archivage actif
      ansible.builtin.systemd:
        name: "postgresql@{{ majeure }}-main"
        state: started
        enabled: true

    - name: Créer le rôle applicatif
      ansible.builtin.command:
        cmd: 'sudo -u postgres psql -X -v ON_ERROR_STOP=1 -c "do $$ begin if not exists (select 1 from pg_roles where rolname = ''{{ role_applicatif }}'') then create role {{ role_applicatif }} login password ''{{ mot_de_passe }}''; end if; end $$;"'
      changed_when: false

    - name: Créer la base, dont le rôle est propriétaire
      ansible.builtin.shell:
        cmd: 'sudo -u postgres psql -X -At -c "select 1 from pg_database where datname = ''{{ base }}''" | grep -q 1 || sudo -u postgres createdb -O {{ role_applicatif }} {{ base }}'
        executable: /bin/bash
      changed_when: false

    - name: Poser la table et ses cinq lignes d'origine
      ansible.builtin.command:
        cmd: 'sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d {{ base }} -c "create schema if not exists {{ schema }} authorization {{ role_applicatif }}; drop table if exists {{ schema }}.clients; create table {{ schema }}.clients (id serial primary key, nom text not null); insert into {{ schema }}.clients (nom) values (''Alice Martin''), (''Bob Dupont''), (''Claire Durand''), (''David Moreau''), (''Eva Bernard''); alter table {{ schema }}.clients owner to {{ role_applicatif }};"'
      changed_when: false

    - name: Archiver ce qui précède la sauvegarde physique
      ansible.builtin.command:
        cmd: sudo -u postgres psql -X -At -c "select pg_switch_wal()"
      changed_when: false

    # ── 2. La sauvegarde physique : elle ne connaît que CINQ lignes ──────
    - name: Prendre la sauvegarde physique de la grappe
      ansible.builtin.command:
        cmd: sudo -u postgres pg_basebackup -D {{ basebackup }} -Fp
        creates: "{{ basebackup }}/backup_manifest"

    # ── 3. La sixième ligne, qui n'existe QUE dans les journaux ──────────
    #
    # C'est elle qui interdit de se contenter de restaurer la copie physique :
    # une restauration qui s'arrête là rend cinq lignes, et le test refuse.
    - name: Insérer la ligne qui doit survivre à la restauration
      ansible.builtin.command:
        cmd: 'sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d {{ base }} -c "insert into {{ schema }}.clients (nom) values (''PITR Test'')"'
      changed_when: false

    - name: Archiver le journal qui porte cette ligne
      ansible.builtin.command:
        cmd: sudo -u postgres psql -X -At -c "select pg_switch_wal()"
      changed_when: false

    # ── 4. L'instant de sécurité, relevé et laissé à l'apprenant ────────
    - name: Relever l'instant qui précède la catastrophe
      ansible.builtin.command:
        cmd: sudo -u postgres psql -X -At -c "select now()"
      register: instant_releve
      changed_when: false

    - name: Laisser cet instant à l'apprenant
      ansible.builtin.copy:
        dest: "{{ instant }}"
        owner: student
        group: student
        mode: "0644"
        content: |
          # Instant releve juste avant l'incident, par celui qui a eu le
          # reflexe de le noter. C'est la cible de la restauration.
          #
          # A cet instant, la table appli.clients portait SIX lignes.
          {{ instant_releve.stdout | trim }}

    # ── 5. Trois secondes, pour que la cible soit franchement antérieure ─
    #
    # Sans cette attente, la cible et le DROP tomberaient dans la même
    # seconde, et la restauration pourrait franchir la transaction fautive.
    - name: Laisser passer trois secondes avant la catastrophe
      ansible.builtin.wait_for:
        timeout: 3

    # ── 6. La catastrophe, et son journal archivé ───────────────────────
    - name: Jouer le DROP TABLE de la migration mal relue
      ansible.builtin.command:
        cmd: 'sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d {{ base }} -c "drop table {{ schema }}.clients"'
      changed_when: true

    - name: Archiver le journal qui porte le DROP
      ansible.builtin.command:
        cmd: sudo -u postgres psql -X -At -c "select pg_switch_wal()"
      changed_when: false

    - name: Laisser à l'archiveur le temps de poser les derniers segments
      ansible.builtin.wait_for:
        timeout: 5

    - name: Déposer le rapport à remplir
      ansible.builtin.copy:
        dest: /home/student/rapport-restauration.txt
        owner: student
        group: student
        mode: "0644"
        content: |
          # Rapport de restauration a un instant donne.
          #
          # Renseigne les trois valeurs ci-dessous avec ce que le serveur
          # repond VRAIMENT, apres restauration. Les lignes de commentaire ne
          # sont pas lues par le test : seules les lignes « cle = valeur »
          # comptent.
          #
          # Ne supprime pas ces lignes d'en-tete : elles prouvent que tu as
          # edite ce fichier au lieu de le recreer.

          lignes_restaurees = A_COMPLETER
          timeline_apres_restauration = A_COMPLETER
          serveur_en_recovery = A_COMPLETER
