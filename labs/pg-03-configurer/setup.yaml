---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose la situation que
# le scénario décrit.
#
# CE QUE CE SETUP DONNE
#
# Une instance PostgreSQL 18 qui tourne, dont le collecteur de journaux est
# déjà actif et dont RIEN d'autre n'est réglé : aucun seuil de requête lente,
# aucune trace de connexion, un `log_line_prefix` muet, et `max_connections`
# à sa valeur d'usine.
#
# POURQUOI LE COLLECTEUR EST DÉJÀ ACTIF
#
# `logging_collector` est de contexte `postmaster` : l'activer exige un
# REDÉMARRAGE. Or ce lab interdit le redémarrage, et le vérifie. Le laisser
# éteint rendrait le lab insoluble, ce qui est pire qu'un lab trop facile :
# l'apprenant chercherait longtemps une faute qui est la nôtre.
#
# Il laisse aussi une session ouverte en arrière-plan, qui doit SURVIVRE au
# travail : c'est elle qui prouve qu'un rechargement ne coupe personne.
- name: Préparer le lab pg-03-configurer
  hosts: lab_target
  become: true
  vars:
    majeure: "18"
  tasks:

    - name: Installer gnupg pour contrôler l'empreinte de la clé
      ansible.builtin.apt:
        name: gnupg
        state: present
        update_cache: true

    - name: Récupérer la clé du dépôt PGDG
      ansible.builtin.get_url:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        dest: /etc/apt/keyrings/pgdg.asc
        mode: "0644"

    - name: Déclarer le dépôt PGDG, lié à sa clé
      ansible.builtin.deb822_repository:
        name: pgdg
        types: deb
        uris: https://apt.postgresql.org/pub/repos/apt
        suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
        components: main
        signed_by: /etc/apt/keyrings/pgdg.asc
        state: present

    - name: Installer PostgreSQL {{ majeure }}
      ansible.builtin.apt:
        name: "postgresql-{{ majeure }}"
        state: present
        update_cache: true

    - name: Démarrer le cluster et l'activer au démarrage
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true

    # Remettre les valeurs d'usine : un passage précédent a pu les changer, et
    # l'isolation par base figée ne couvre pas le fichier auto.conf.
    - name: Effacer ce qu'un ALTER SYSTEM aurait laissé
      ansible.builtin.copy:
        dest: "/var/lib/postgresql/{{ majeure }}/main/postgresql.auto.conf"
        owner: postgres
        group: postgres
        mode: "0600"
        content: |
          # Do not edit this file manually!
          # It will be overwritten by the ALTER SYSTEM command.
      notify: Redémarrer PostgreSQL

    - name: Remettre les quatre réglages du lab à leur valeur d'usine
      ansible.builtin.lineinfile:
        path: "/etc/postgresql/{{ majeure }}/main/postgresql.conf"
        regexp: "^#?{{ item.cle }}"
        line: "{{ item.cle }} = {{ item.valeur }}"
      loop:
        - { cle: logging_collector, valeur: "on" }
        - { cle: log_min_duration_statement, valeur: "-1" }
        - { cle: log_connections, valeur: "off" }
        - { cle: max_connections, valeur: "100" }
      loop_control:
        label: "{{ item.cle }}"
      notify: Redémarrer PostgreSQL

    - name: Retirer un log_line_prefix d'un passage précédent
      ansible.builtin.lineinfile:
        path: "/etc/postgresql/{{ majeure }}/main/postgresql.conf"
        regexp: "^log_line_prefix"
        state: absent
      notify: Redémarrer PostgreSQL

    - name: Appliquer l'état de départ avant d'ouvrir la session
      ansible.builtin.meta: flush_handlers

    # ── La session qui doit survivre ──────────────────────────────────────
    #
    # Ouverte en arrière-plan et laissée en vie plusieurs heures. Un
    # rechargement ne la coupe pas ; un redémarrage la tue. C'est la preuve,
    # côté serveur, que l'apprenant n'a pas redémarré.
    - name: Ouvrir une session témoin, qui ne doit pas être coupée
      ansible.builtin.shell:
        cmd: >
          setsid nohup sudo -u postgres psql -X -d postgres -c
          "set application_name = 'temoin-pg-03'; select pg_sleep(14400)"
          > /dev/null 2>&1 &
        executable: /bin/bash
      changed_when: false

    - name: Laisser à la session témoin le temps de s'enregistrer
      ansible.builtin.wait_for:
        timeout: 3

    - name: Déposer le rapport à remplir
      ansible.builtin.copy:
        dest: /home/student/rapport-configuration.txt
        owner: student
        group: student
        mode: "0644"
        content: |
          # Rapport de configuration de l'instance.
          #
          # Renseigne les trois valeurs ci-dessous avec ce que le serveur
          # repond VRAIMENT, lues dans pg_settings. Les lignes de commentaire
          # ne sont pas lues par le test : seules les lignes « cle = valeur »
          # comptent.
          #
          # Ne supprime pas ces lignes d'en-tete : elles prouvent que tu as
          # edite ce fichier au lieu de le recreer.

          max_connections_effectif = A_COMPLETER
          max_connections_en_attente = A_COMPLETER
          nb_parametres_en_attente = A_COMPLETER

  handlers:
    - name: Redémarrer PostgreSQL
      ansible.builtin.systemd:
        name: "postgresql@{{ majeure }}-main"
        state: restarted
