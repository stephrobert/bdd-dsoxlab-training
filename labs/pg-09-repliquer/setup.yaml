---
# Joué par `dsoxlab run` avant d'ouvrir la session. DEUX PLAYS, car ce lab
# porte sur deux machines : `lab_target` est db1.lab, et `lab_standby` est le
# groupe que dsoxlab crée depuis `runtime.targets[].roles.standby`.
#
# CE QUE CE SETUP DONNE
#
# Sur db1 : une instance qui écoute sur le réseau, la base `facturation`, sa
# table de clients, et une table `sonde` vide qui servira à prouver le flux.
# Sur db2 : PostgreSQL installé et une grappe VIDE qui tourne pour rien, c'est
# à dire exactement ce que l'installation Debian laisse.
#
# CE QU'IL NE DONNE PAS, ET QUI EST LE TRAVAIL
#
# Aucun rôle de réplication, aucun slot, aucune règle d'accès pour la
# réplication, et aucun lien entre les deux machines.
- name: Préparer le primaire du lab pg-09-repliquer
  hosts: lab_target
  become: true
  vars:
    majeure: "18"
    role_applicatif: appli
    mot_de_passe: "Ch4ngeMoi!2026"
    base: facturation
    schema: appli
  tasks:

    - name: Installer gnupg pour contrôler l'empreinte de la clé
      ansible.builtin.apt:
        name: gnupg
        state: present
        update_cache: true

    - name: Récupérer la clé du dépôt PGDG
      ansible.builtin.get_url:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        dest: /etc/apt/keyrings/pgdg.asc
        mode: "0644"

    - name: Déclarer le dépôt PGDG, lié à sa clé
      ansible.builtin.deb822_repository:
        name: pgdg
        types: deb
        uris: https://apt.postgresql.org/pub/repos/apt
        suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
        components: main
        signed_by: /etc/apt/keyrings/pgdg.asc
        state: present

    - name: Installer PostgreSQL {{ majeure }}
      ansible.builtin.apt:
        name: "postgresql-{{ majeure }}"
        state: present
        update_cache: true

    - name: Démarrer le cluster et l'activer au démarrage
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true

    # Le secondaire se connectera par le réseau : sans cela, rien n'est
    # joignable, et ce n'est pas le sujet du lab.
    - name: Faire écouter le primaire sur le réseau
      ansible.builtin.lineinfile:
        path: "/etc/postgresql/{{ majeure }}/main/postgresql.conf"
        regexp: "^#?listen_addresses"
        line: "listen_addresses = '*'"
      notify: Redémarrer PostgreSQL

    - name: Effacer ce qu'un ALTER SYSTEM aurait laissé
      ansible.builtin.copy:
        dest: "/var/lib/postgresql/{{ majeure }}/main/postgresql.auto.conf"
        owner: postgres
        group: postgres
        mode: "0600"
        content: |
          # Do not edit this file manually!
          # It will be overwritten by the ALTER SYSTEM command.
      notify: Redémarrer PostgreSQL

    # Reconstruits à chaque passage : une règle de réplication laissée par un
    # passage précédent rendrait un test vert sans travail.
    - name: Retirer une règle de réplication d'un passage précédent
      ansible.builtin.lineinfile:
        path: "/etc/postgresql/{{ majeure }}/main/pg_hba.conf"
        regexp: "^host(ssl)?\\s+replication"
        state: absent
      notify: Redémarrer PostgreSQL

    - name: Appliquer l'état de départ avant de poser les données
      ansible.builtin.meta: flush_handlers

    - name: Retirer le slot et le rôle de réplication d'un passage précédent
      ansible.builtin.shell:
        cmd: 'sudo -u postgres psql -X -c "select pg_drop_replication_slot(''standby_slot'') where exists (select 1 from pg_replication_slots where slot_name = ''standby_slot'')" 2>/dev/null; sudo -u postgres psql -X -c "drop role if exists replicator" 2>/dev/null; true'
        executable: /bin/bash
      changed_when: false

    - name: Créer le rôle applicatif
      ansible.builtin.command:
        cmd: 'sudo -u postgres psql -X -v ON_ERROR_STOP=1 -c "do $$ begin if not exists (select 1 from pg_roles where rolname = ''{{ role_applicatif }}'') then create role {{ role_applicatif }} login password ''{{ mot_de_passe }}''; end if; end $$;"'
      changed_when: false

    - name: Créer la base, dont le rôle est propriétaire
      ansible.builtin.shell:
        cmd: 'sudo -u postgres psql -X -At -c "select 1 from pg_database where datname = ''{{ base }}''" | grep -q 1 || sudo -u postgres createdb -O {{ role_applicatif }} {{ base }}'
        executable: /bin/bash
      changed_when: false

    # La table `sonde` est VIDE à dessein : c'est par elle que le test prouve
    # le flux, en écrivant ici et en lisant là-bas.
    - name: Poser les tables, dont la sonde qui prouvera le flux
      ansible.builtin.command:
        cmd: 'sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d {{ base }} -c "create schema if not exists {{ schema }} authorization {{ role_applicatif }}; create table if not exists {{ schema }}.clients (id serial primary key, nom text not null); insert into {{ schema }}.clients (nom) select x from (values (''Alice Martin''), (''Bob Dupont''), (''Claire Durand'')) as v(x) where not exists (select 1 from {{ schema }}.clients); drop table if exists {{ schema }}.sonde; create table {{ schema }}.sonde (id serial primary key, marque text not null);"'
      changed_when: false

    - name: Déposer le rapport à remplir, sur le primaire
      ansible.builtin.copy:
        dest: /home/student/rapport-replication.txt
        owner: student
        group: student
        mode: "0644"
        content: |
          # Rapport de replication.
          #
          # Renseigne les trois valeurs ci-dessous avec ce que le PRIMAIRE
          # repond VRAIMENT. Les lignes de commentaire ne sont pas lues par le
          # test : seules les lignes « cle = valeur » comptent.
          #
          # Ne supprime pas ces lignes d'en-tete : elles prouvent que tu as
          # edite ce fichier au lieu de le recreer.

          nb_secondaires_en_flux = A_COMPLETER
          slot_actif = A_COMPLETER
          replicator_est_superuser = A_COMPLETER

  handlers:
    - name: Redémarrer PostgreSQL
      ansible.builtin.systemd:
        name: "postgresql@{{ majeure }}-main"
        state: restarted

# ── La seconde machine ──────────────────────────────────────────────────────
#
# Elle reçoit PostgreSQL et une grappe VIDE qui tourne. C'est l'état que
# l'installation Debian laisse, et c'est précisément ce qui fait échouer un
# `pg_basebackup` naïf : le répertoire de données n'est pas vide.
- name: Préparer le secondaire du lab pg-09-repliquer
  hosts: lab_standby
  become: true
  vars:
    majeure: "18"
  tasks:

    - name: Installer gnupg pour contrôler l'empreinte de la clé
      ansible.builtin.apt:
        name: gnupg
        state: present
        update_cache: true

    - name: Récupérer la clé du dépôt PGDG
      ansible.builtin.get_url:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        dest: /etc/apt/keyrings/pgdg.asc
        mode: "0644"

    - name: Déclarer le dépôt PGDG, lié à sa clé
      ansible.builtin.deb822_repository:
        name: pgdg
        types: deb
        uris: https://apt.postgresql.org/pub/repos/apt
        suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
        components: main
        signed_by: /etc/apt/keyrings/pgdg.asc
        state: present

    - name: Installer PostgreSQL {{ majeure }}
      ansible.builtin.apt:
        name: "postgresql-{{ majeure }}"
        state: present
        update_cache: true

    # Si un passage précédent en a fait un secondaire, la grappe porte un
    # `standby.signal` et suit un primaire disparu. On la refait à neuf avec
    # les outils de Debian plutôt que d'essayer de la défaire.
    - name: Repérer une grappe laissée en secondaire
      ansible.builtin.stat:
        path: "/var/lib/postgresql/{{ majeure }}/main/standby.signal"
      register: ancien_secondaire

    - name: Refaire une grappe neuve si la précédente était un secondaire
      ansible.builtin.shell:
        cmd: 'pg_dropcluster {{ majeure }} main --stop && pg_createcluster {{ majeure }} main --start'
        executable: /bin/bash
      when: ancien_secondaire.stat.exists
      changed_when: true

    - name: Retirer un fichier de mots de passe d'un passage précédent
      ansible.builtin.file:
        path: /var/lib/postgresql/.pgpass
        state: absent

    - name: Démarrer la grappe vide, qui tourne pour rien
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true
