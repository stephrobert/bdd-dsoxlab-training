---
# Joué par `dsoxlab run` avant d'ouvrir la session.
#
# CE QUE CE SETUP DONNE
#
# L'état d'arrivée de mysql-01 : une instance 8.4 qui tourne, fermée sur sa
# boucle locale sur ses DEUX ports, et le compte d'administration `labadmin`.
# On ne redemande pas ce travail.
#
# CE QU'IL NE DONNE PAS, ET QUI EST LE TRAVAIL
#
# Aucun login path pour `student`, aucune base applicative, aucun MySQL Shell,
# et le Performance Schema ÉTEINT. Ce dernier point est posé explicitement :
# il est actif par défaut, donc sans ce réglage le test serait vert avant tout
# travail.
- name: Préparer le lab mysql-02-client-admin
  hosts: lab_target
  become: true
  vars:
    mdp_root: "R00t!Lab2026"
    admin: labadmin
    mdp_admin: "Adm1n!Lab2026"
    base: labdb
    conf_dir: /etc/mysql/mysql.conf.d
  tasks:

    - name: Installer de quoi vérifier une signature
      ansible.builtin.apt:
        name:
          - gnupg
          - ca-certificates
        state: present
        update_cache: true

    # La clé 2025 et non la 2023 : cette dernière a EXPIRÉ le 2025-10-22, et
    # apt refuse alors le dépôt en répondant « is not signed », qui ne parle
    # pas d'expiration. Mesuré le 2026-10-20.
    - name: Récupérer la clé de signature d'Oracle, en cours de validité
      ansible.builtin.get_url:
        url: https://repo.mysql.com/RPM-GPG-KEY-mysql-2025
        dest: /etc/apt/keyrings/mysql.asc
        mode: "0644"

    - name: Déclarer le dépôt MySQL 8.4 LTS, lié à sa clé
      ansible.builtin.deb822_repository:
        name: mysql
        types: deb
        uris: https://repo.mysql.com/apt/debian
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: mysql-8.4-lts
        signed_by: /etc/apt/keyrings/mysql.asc
        state: present

    - name: Pré-configurer le mot de passe root
      ansible.builtin.shell:
        cmd: 'printf "%s\n%s\n" "mysql-community-server mysql-community-server/root-pass password {{ mdp_root }}" "mysql-community-server mysql-community-server/re-root-pass password {{ mdp_root }}" | debconf-set-selections'
        executable: /bin/bash
      changed_when: true

    - name: Installer MySQL 8.4 LTS
      ansible.builtin.apt:
        name: mysql-server
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    # ── L'état d'arrivée de mysql-01 : les deux portes fermées ───────────
    - name: Restreindre l'écoute des deux protocoles à la boucle locale
      ansible.builtin.copy:
        dest: "{{ conf_dir }}/z-lab-bind.cnf"
        owner: root
        group: root
        mode: "0644"
        content: |
          [mysqld]
          bind-address        = 127.0.0.1
          mysqlx-bind-address = 127.0.0.1

    # ── Le Performance Schema ÉTEINT, et c'est le travail du lab ─────────
    #
    # Il est ACTIF par défaut : sans ce fichier, le test correspondant serait
    # vert avant tout travail. Le scénario le justifie, quelqu'un l'ayant
    # éteint pour gagner de la mémoire et ne l'ayant jamais rallumé.
    - name: Éteindre le Performance Schema
      ansible.builtin.copy:
        dest: "{{ conf_dir }}/z-lab-perfschema.cnf"
        owner: root
        group: root
        mode: "0644"
        content: |
          [mysqld]
          performance_schema = OFF

    # Un `mysqld-auto.cnf` laissé par un `SET PERSIST` d'un passage précédent
    # surchargerait ce fichier : on l'efface.
    - name: Effacer ce qu'un SET PERSIST aurait laissé
      ansible.builtin.file:
        path: /var/lib/mysql/mysqld-auto.cnf
        state: absent

    - name: Démarrer le service, activé au démarrage
      ansible.builtin.systemd:
        name: mysql
        state: restarted
        enabled: true

    - name: Attendre que le serveur réponde
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3306
        timeout: 60

    - name: Créer le compte d'administration
      ansible.builtin.shell:
        cmd: 'MYSQL_PWD="{{ mdp_root }}" mysql -u root -e "create user if not exists ''{{ admin }}''@''localhost'' identified by ''{{ mdp_admin }}''; grant all privileges on *.* to ''{{ admin }}''@''localhost'' with grant option;"'
        executable: /bin/bash
      changed_when: false

    # ── Défaire ce qu'un passage précédent aurait laissé ────────────────
    - name: Retirer le login path de student
      ansible.builtin.file:
        path: /home/student/.mylogin.cnf
        state: absent

    - name: Retirer la base applicative d'un passage précédent
      ansible.builtin.shell:
        cmd: 'MYSQL_PWD="{{ mdp_root }}" mysql -u root -e "drop database if exists {{ base }}"'
        executable: /bin/bash
      changed_when: false

    - name: Désinstaller MySQL Shell d'un passage précédent
      ansible.builtin.apt:
        name: mysql-shell
        state: absent
        purge: true
      failed_when: false

    - name: Déposer le rapport à remplir
      ansible.builtin.copy:
        dest: /home/student/rapport-client.txt
        owner: student
        group: student
        mode: "0644"
        content: |
          # Rapport de prise en main du client MySQL.
          #
          # Renseigne les trois valeurs ci-dessous avec ce que le SERVEUR
          # repond. Les lignes de commentaire ne sont pas lues par le test :
          # seules les lignes « cle = valeur » comptent.
          #
          # Ne supprime pas ces lignes d'en-tete : elles prouvent que tu as
          # edite ce fichier au lieu de le recreer.

          performance_schema_actif = A_COMPLETER
          nb_tables_labdb = A_COMPLETER
          moteur_de_la_table_clients = A_COMPLETER
