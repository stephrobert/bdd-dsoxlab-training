---
# Joué par `dsoxlab run` avant d'ouvrir la session.
#
# CE QUE CE SETUP CONSTRUIT, ET POURQUOI CHAQUE DÉTAIL COMPTE
#
# Une table `appli.journal` de cent mille lignes insérées, dont quarante mille
# sont ensuite SUPPRIMÉES : l'espace reste occupé par des lignes mortes.
#
# `autovacuum_enabled = false` sur cette table, et ce n'est pas un détail :
# sans cela l'autovacuum passerait de lui-même dans la minute, récupérerait
# l'espace, et le test du nettoyage serait VERT avant tout travail. Le scénario
# le justifie, du reste : l'autovacuum a été désactivé lors d'une opération et
# jamais réactivé, ce qui est une situation courante.
#
# AUCUN index sur la colonne filtrée, pour que le planificateur n'ait d'autre
# choix qu'un parcours séquentiel. Et `shared_preload_libraries` vide, pour que
# le serveur ne garde aucune trace de ce qu'il exécute.
- name: Préparer le lab pg-06-observer
  hosts: lab_target
  become: true
  vars:
    majeure: "18"
    role_applicatif: appli
    mot_de_passe: "Ch4ngeMoi!2026"
    base: facturation
    schema: appli
    table: journal
  tasks:

    - name: Installer gnupg pour contrôler l'empreinte de la clé
      ansible.builtin.apt:
        name: gnupg
        state: present
        update_cache: true

    - name: Récupérer la clé du dépôt PGDG
      ansible.builtin.get_url:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        dest: /etc/apt/keyrings/pgdg.asc
        mode: "0644"

    - name: Déclarer le dépôt PGDG, lié à sa clé
      ansible.builtin.deb822_repository:
        name: pgdg
        types: deb
        uris: https://apt.postgresql.org/pub/repos/apt
        suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
        components: main
        signed_by: /etc/apt/keyrings/pgdg.asc
        state: present

    - name: Installer PostgreSQL {{ majeure }} et ses contributions
      ansible.builtin.apt:
        name:
          - "postgresql-{{ majeure }}"
          - "postgresql-contrib-{{ majeure }}"
        state: present
        update_cache: true

    - name: Démarrer le cluster et l'activer au démarrage
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true

    # ── L'état de départ : le serveur ne garde aucune trace ──────────────
    - name: Effacer ce qu'un ALTER SYSTEM aurait laissé
      ansible.builtin.copy:
        dest: "/var/lib/postgresql/{{ majeure }}/main/postgresql.auto.conf"
        owner: postgres
        group: postgres
        mode: "0600"
        content: |
          # Do not edit this file manually!
          # It will be overwritten by the ALTER SYSTEM command.
      notify: Redémarrer PostgreSQL

    - name: Ne précharger aucune bibliothèque de collecte
      ansible.builtin.lineinfile:
        path: "/etc/postgresql/{{ majeure }}/main/postgresql.conf"
        regexp: "^#?shared_preload_libraries"
        line: "shared_preload_libraries = ''"
      notify: Redémarrer PostgreSQL

    - name: Appliquer l'état de départ avant de poser les données
      ansible.builtin.meta: flush_handlers

    - name: Créer le rôle applicatif
      ansible.builtin.command:
        cmd: >
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -c
          "do $$ begin
             if not exists (select 1 from pg_roles where rolname = '{{ role_applicatif }}')
             then create role {{ role_applicatif }} login password '{{ mot_de_passe }}';
             end if;
           end $$;"
      changed_when: false

    - name: Créer la base, dont le rôle est propriétaire
      ansible.builtin.shell:
        cmd: >
          sudo -u postgres psql -X -At -c
          "select 1 from pg_database where datname = '{{ base }}'" | grep -q 1
          || sudo -u postgres createdb -O {{ role_applicatif }} {{ base }}
        executable: /bin/bash
      changed_when: false

    # Reconstruite à chaque passage : un index ou un VACUUM laissés par un
    # passage précédent rendraient deux tests verts sans travail.
    - name: Reconstruire la table dans son état fautif
      ansible.builtin.command:
        cmd: >
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d {{ base }} -c
          "create schema if not exists {{ schema }} authorization {{ role_applicatif }};
           drop table if exists {{ schema }}.{{ table }};
           create table {{ schema }}.{{ table }}
             (id bigserial primary key,
              client_id int not null,
              detail text not null);
           alter table {{ schema }}.{{ table }} set (autovacuum_enabled = false);
           insert into {{ schema }}.{{ table }} (client_id, detail)
             select (i % 1000) + 1, 'evenement numero ' || i
             from generate_series(1, 100000) as s(i);
           delete from {{ schema }}.{{ table }} where id > 60000;
           analyze {{ schema }}.{{ table }};
           alter table {{ schema }}.{{ table }} owner to {{ role_applicatif }};"
      changed_when: false

    # L'extension et l'index d'un passage précédent, retirés après la
    # reconstruction : le `drop table` a déjà emporté l'index, l'extension non.
    - name: Retirer l'extension de collecte d'un passage précédent
      ansible.builtin.command:
        cmd: >
          sudo -u postgres psql -X -d {{ base }} -c
          "drop extension if exists pg_stat_statements"
      changed_when: false

    - name: Déposer le rapport à remplir
      ansible.builtin.copy:
        dest: /home/student/rapport-observation.txt
        owner: student
        group: student
        mode: "0644"
        content: |
          # Rapport d'observation de l'instance.
          #
          # Renseigne les trois valeurs ci-dessous avec ce que le serveur
          # repond VRAIMENT. Les lignes de commentaire ne sont pas lues par
          # le test : seules les lignes « cle = valeur » comptent.
          #
          # Ne supprime pas ces lignes d'en-tete : elles prouvent que tu as
          # edite ce fichier au lieu de le recreer.

          lignes_mortes_journal = A_COMPLETER
          nb_index_sur_journal = A_COMPLETER
          bibliotheque_chargee = A_COMPLETER

  handlers:
    - name: Redémarrer PostgreSQL
      ansible.builtin.systemd:
        name: "postgresql@{{ majeure }}-main"
        state: restarted
