---
# Joué par `dsoxlab run` avant d'ouvrir la session.
#
# CE QUE CE SETUP DONNE
#
# Une instance PostgreSQL 18 qui tourne, une base `facturation` avec de quoi
# produire des journaux, et le répertoire PARENT des sauvegardes, qui
# appartient à postgres.
#
# CE QU'IL NE DONNE PAS, ET QUI EST LE TRAVAIL
#
# Le répertoire d'archive n'existe pas, `archive_mode` est explicitement à
# `off`, aucun journal n'est parti, et il n'y a aucune sauvegarde physique.
#
# Tout est RECONSTRUIT à chaque passage, y compris la suppression du
# répertoire d'archive et de la sauvegarde : sans cela, ce qu'un passage
# précédent a produit rendrait trois tests verts sans travail.
- name: Préparer le lab pg-07-archiver
  hosts: lab_target
  become: true
  vars:
    majeure: "18"
    role_applicatif: appli
    mot_de_passe: "Ch4ngeMoi!2026"
    base: facturation
    schema: appli
    archives: /var/lib/postgresql/wal_archive
    sauvegardes: /var/lib/postgresql/backups
  tasks:

    - name: Installer gnupg pour contrôler l'empreinte de la clé
      ansible.builtin.apt:
        name: gnupg
        state: present
        update_cache: true

    - name: Récupérer la clé du dépôt PGDG
      ansible.builtin.get_url:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        dest: /etc/apt/keyrings/pgdg.asc
        mode: "0644"

    - name: Déclarer le dépôt PGDG, lié à sa clé
      ansible.builtin.deb822_repository:
        name: pgdg
        types: deb
        uris: https://apt.postgresql.org/pub/repos/apt
        suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
        components: main
        signed_by: /etc/apt/keyrings/pgdg.asc
        state: present

    - name: Installer PostgreSQL {{ majeure }}
      ansible.builtin.apt:
        name: "postgresql-{{ majeure }}"
        state: present
        update_cache: true

    - name: Démarrer le cluster et l'activer au démarrage
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true

    # ── L'état de départ : rien n'est archivé, rien n'est sauvegardé ─────
    - name: Effacer ce qu'un ALTER SYSTEM aurait laissé
      ansible.builtin.copy:
        dest: "/var/lib/postgresql/{{ majeure }}/main/postgresql.auto.conf"
        owner: postgres
        group: postgres
        mode: "0600"
        content: |
          # Do not edit this file manually!
          # It will be overwritten by the ALTER SYSTEM command.
      notify: Redémarrer PostgreSQL

    - name: Éteindre explicitement l'archivage
      ansible.builtin.lineinfile:
        path: "/etc/postgresql/{{ majeure }}/main/postgresql.conf"
        regexp: "^#?archive_mode"
        line: "archive_mode = off"
      notify: Redémarrer PostgreSQL

    - name: Retirer une archive_command d'un passage précédent
      ansible.builtin.lineinfile:
        path: "/etc/postgresql/{{ majeure }}/main/postgresql.conf"
        regexp: "^archive_command"
        state: absent
      notify: Redémarrer PostgreSQL

    - name: Effacer le répertoire d'archive et la sauvegarde d'un passage précédent
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ archives }}"
        - "{{ sauvegardes }}/base"

    - name: Appliquer l'état de départ avant de poser les données
      ansible.builtin.meta: flush_handlers

    # Le PARENT des sauvegardes est fourni : le lab porte sur l'archivage et
    # la sauvegarde, pas sur la création d'un répertoire dans /var/lib.
    - name: Poser le répertoire parent des sauvegardes
      ansible.builtin.file:
        path: "{{ sauvegardes }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: Créer le rôle applicatif
      ansible.builtin.command:
        cmd: 'sudo -u postgres psql -X -v ON_ERROR_STOP=1 -c "do $$ begin if not exists (select 1 from pg_roles where rolname = ''{{ role_applicatif }}'') then create role {{ role_applicatif }} login password ''{{ mot_de_passe }}''; end if; end $$;"'
      changed_when: false

    - name: Créer la base, dont le rôle est propriétaire
      ansible.builtin.shell:
        cmd: 'sudo -u postgres psql -X -At -c "select 1 from pg_database where datname = ''{{ base }}''" | grep -q 1 || sudo -u postgres createdb -O {{ role_applicatif }} {{ base }}'
        executable: /bin/bash
      changed_when: false

    # De quoi produire des journaux : sans écritures, aucun segment ne se
    # remplit, et le lab n'aurait rien à archiver.
    - name: Poser une table et de quoi remplir des journaux
      ansible.builtin.command:
        cmd: 'sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d {{ base }} -c "create schema if not exists {{ schema }} authorization {{ role_applicatif }}; drop table if exists {{ schema }}.ecritures; create table {{ schema }}.ecritures (id bigserial primary key, valeur text not null); insert into {{ schema }}.ecritures (valeur) select ''ecriture '' || i from generate_series(1, 50000) as s(i);"'
      changed_when: false

    - name: Déposer le rapport à remplir
      ansible.builtin.copy:
        dest: /home/student/rapport-archivage.txt
        owner: student
        group: student
        mode: "0644"
        content: |
          # Rapport d'archivage et de sauvegarde physique.
          #
          # Renseigne les trois valeurs ci-dessous avec ce que le serveur et
          # les outils repondent VRAIMENT. Les lignes de commentaire ne sont
          # pas lues par le test : seules les lignes « cle = valeur » comptent.
          #
          # Ne supprime pas ces lignes d'en-tete : elles prouvent que tu as
          # edite ce fichier au lieu de le recreer.

          archive_mode_en_service = A_COMPLETER
          nb_wal_archives = A_COMPLETER
          verdict_verifybackup = A_COMPLETER

  handlers:
    - name: Redémarrer PostgreSQL
      ansible.builtin.systemd:
        name: "postgresql@{{ majeure }}-main"
        state: restarted
