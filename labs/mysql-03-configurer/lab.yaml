# Canonique en anglais. `lab.fr.yaml` surcharge titre et description.
id: mysql-03-configurer
title: "Configure memory, connections and the slow log, so it survives a restart"
description: |
  Raise the InnoDB buffer pool and the connection ceiling, turn the slow query
  log on, and make all of it survive a restart. Graded on a RESTART, because
  nothing else proves the round trip: `SET PERSIST` and `SET GLOBAL` report the
  same source on a running server, measured. And the slow log is graded on a
  slow query actually landing in it.
section: mysql-niveau-1
level: mysql-niveau-1
lab_type: lab
difficulty: intermediate
estimated_time: "40m"
skills:
  - mysql
  - configuration
  - exploitation
distros:
  - debian13
doc_url: https://www.stephane-robert.info/docs/services/bdd/relationnelles/mysql/configuration/
certification_tags: []
runtime:
  type: vm
  targets:
    - name: db1
      host: db1.lab
      label_en: "Debian 13"
      label_fr: "Debian 13"
  default: db1
validation:
  functional: true
  security: false
  persistence_after_reboot: true
