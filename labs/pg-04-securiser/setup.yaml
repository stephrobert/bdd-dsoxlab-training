---
# Joué par `dsoxlab run` avant d'ouvrir la session.
#
# CE QUE CE SETUP DONNE
#
# L'état d'arrivée de pg-02 : une instance qui écoute sur le réseau, un rôle de
# connexion `appli` avec son mot de passe, la base `facturation`, un schéma
# `appli` et deux tables remplies, et un `.pgpass` en 0600 pour que `student`
# se connecte sans mot de passe tapé. On ne redemande pas ce travail.
#
# CE QU'IL NE DONNE PAS, ET QUI EST LE TRAVAIL
#
# La ligne réseau de `pg_hba.conf` est un `host` : elle accepte le clair. Le
# certificat est celui de Debian (`ssl-cert-snakeoil`), le même sur toutes les
# machines du parc. `appli` est PROPRIÉTAIRE de son schéma et de ses tables,
# donc il peut les supprimer. Aucun rôle-groupe n'existe.
#
# `ssl = on`, en revanche, est déjà posé par Debian, et le guide le dit. Ce
# n'est donc pas un manque du setup : c'est un état du système que le lab ne
# peut pas noter sans noter le paquet Debian.
- name: Préparer le lab pg-04-securiser
  hosts: lab_target
  become: true
  vars:
    majeure: "18"
    role_applicatif: appli
    mot_de_passe: "Ch4ngeMoi!2026"
    base: facturation
    schema: appli
  tasks:

    # ── L'instance, comme pg-01 la laisse ─────────────────────────────────
    - name: Installer gnupg pour contrôler l'empreinte de la clé
      ansible.builtin.apt:
        name: gnupg
        state: present
        update_cache: true

    - name: Récupérer la clé du dépôt PGDG
      ansible.builtin.get_url:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        dest: /etc/apt/keyrings/pgdg.asc
        mode: "0644"

    - name: Déclarer le dépôt PGDG, lié à sa clé
      ansible.builtin.deb822_repository:
        name: pgdg
        types: deb
        uris: https://apt.postgresql.org/pub/repos/apt
        suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
        components: main
        signed_by: /etc/apt/keyrings/pgdg.asc
        state: present

    - name: Installer PostgreSQL {{ majeure }} et openssl
      ansible.builtin.apt:
        name:
          - "postgresql-{{ majeure }}"
          - openssl
        state: present
        update_cache: true

    - name: Démarrer le cluster et l'activer au démarrage
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true

    # ── L'état d'arrivée de pg-02 : le réseau est ouvert ──────────────────
    - name: Faire écouter le serveur sur le réseau
      ansible.builtin.lineinfile:
        path: "/etc/postgresql/{{ majeure }}/main/postgresql.conf"
        regexp: "^#?listen_addresses"
        line: "listen_addresses = '*'"
      notify: Redémarrer PostgreSQL

    # Le certificat de Debian, et lui seul : un passage précédent a pu poser le
    # certificat dédié et déclarer ses chemins, or c'est le travail du lab.
    - name: Remettre le certificat livré par Debian
      ansible.builtin.lineinfile:
        path: "/etc/postgresql/{{ majeure }}/main/postgresql.conf"
        regexp: "^#?{{ item.cle }}"
        line: "{{ item.cle }} = '{{ item.valeur }}'"
      loop:
        - { cle: ssl_cert_file, valeur: /etc/ssl/certs/ssl-cert-snakeoil.pem }
        - { cle: ssl_key_file, valeur: /etc/ssl/private/ssl-cert-snakeoil.key }
      loop_control:
        label: "{{ item.cle }}"
      notify: Redémarrer PostgreSQL

    - name: Effacer ce qu'un ALTER SYSTEM aurait laissé
      ansible.builtin.copy:
        dest: "/var/lib/postgresql/{{ majeure }}/main/postgresql.auto.conf"
        owner: postgres
        group: postgres
        mode: "0600"
        content: |
          # Do not edit this file manually!
          # It will be overwritten by the ALTER SYSTEM command.
      notify: Redémarrer PostgreSQL

    - name: Retirer un certificat dédié d'un passage précédent
      ansible.builtin.file:
        path: "/etc/postgresql/{{ majeure }}/main/{{ item }}"
        state: absent
      loop:
        - server.crt
        - server.key

    # ── La ligne réseau qui accepte le clair : le défaut à corriger ───────
    #
    # `host` et non `hostssl` : le client décide, donc rien n'est imposé. Elle
    # est réécrite à chaque passage pour effacer un `hostssl` déjà posé.
    - name: Poser la ligne réseau en clair
      ansible.builtin.lineinfile:
        path: "/etc/postgresql/{{ majeure }}/main/pg_hba.conf"
        regexp: "^host(ssl)?\\s+{{ base }}\\s+{{ role_applicatif }}"
        line: "host    {{ base }}    {{ role_applicatif }}    {{ reseau }}    scram-sha-256"
        state: present
      vars:
        reseau: "{{ ansible_facts['default_ipv4']['network'] }}/{{ ansible_facts['default_ipv4']['prefix'] }}"
      notify: Recharger PostgreSQL

    - name: Appliquer l'état de départ
      ansible.builtin.meta: flush_handlers

    # ── Le rôle, la base, le schéma et les tables ────────────────────────
    - name: Créer le rôle de connexion applicatif
      ansible.builtin.command:
        cmd: >
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -c
          "do $$ begin
             if not exists (select 1 from pg_roles where rolname = '{{ role_applicatif }}')
             then create role {{ role_applicatif }} login password '{{ mot_de_passe }}';
             end if;
           end $$;"
      changed_when: false

    - name: Retirer les rôles-groupes d'un passage précédent
      ansible.builtin.shell:
        cmd: 'sudo -u postgres psql -X -d {{ base }} -c "drop owned by app_owner, app_writer, app_reader cascade; drop role app_owner, app_writer, app_reader;" 2>/dev/null || true'
        executable: /bin/bash
      changed_when: false

    - name: Créer la base, dont le rôle de connexion est propriétaire
      ansible.builtin.shell:
        cmd: >
          sudo -u postgres psql -X -At -c
          "select 1 from pg_database where datname = '{{ base }}'" | grep -q 1
          || sudo -u postgres createdb -O {{ role_applicatif }} {{ base }}
        executable: /bin/bash
      changed_when: false

    # Le schéma et les tables appartiennent à `appli`, qui peut donc les
    # supprimer : c'est précisément le constat de l'audit.
    - name: Poser le schéma et les deux tables, remplies
      ansible.builtin.command:
        cmd: >
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d {{ base }} -c
          "create schema if not exists {{ schema }} authorization {{ role_applicatif }};
           create table if not exists {{ schema }}.clients
             (id serial primary key, nom text not null);
           create table if not exists {{ schema }}.commandes
             (id serial primary key, client_id int, montant numeric);
           alter table {{ schema }}.clients owner to {{ role_applicatif }};
           alter table {{ schema }}.commandes owner to {{ role_applicatif }};
           insert into {{ schema }}.clients (nom)
             select x from (values ('Durand'), ('Martin')) as v(x)
             where not exists (select 1 from {{ schema }}.clients);
           insert into {{ schema }}.commandes (client_id, montant)
             select 1, 42.00 where not exists (select 1 from {{ schema }}.commandes);"
      changed_when: false

    # ── Le client de student, pour que les preuves soient jouables ────────
    - name: Poser le fichier de mots de passe de student, en 0600
      ansible.builtin.copy:
        dest: /home/student/.pgpass
        owner: student
        group: student
        mode: "0600"
        content: "*:*:{{ base }}:{{ role_applicatif }}:{{ mot_de_passe }}\n"

    - name: Déposer le rapport à remplir
      ansible.builtin.copy:
        dest: /home/student/rapport-securite.txt
        owner: student
        group: student
        mode: "0644"
        content: |
          # Rapport de durcissement de l'instance.
          #
          # Renseigne les trois valeurs ci-dessous avec ce que le serveur
          # presente VRAIMENT. Les lignes de commentaire ne sont pas lues par
          # le test : seules les lignes « cle = valeur » comptent.
          #
          # Ne supprime pas ces lignes d'en-tete : elles prouvent que tu as
          # edite ce fichier au lieu de le recreer.

          cn_du_certificat = A_COMPLETER
          proprietaire_des_tables = A_COMPLETER
          nb_tables_lisibles_par_reader = A_COMPLETER

  handlers:
    - name: Redémarrer PostgreSQL
      ansible.builtin.systemd:
        name: "postgresql@{{ majeure }}-main"
        state: restarted

    - name: Recharger PostgreSQL
      ansible.builtin.systemd:
        name: "postgresql@{{ majeure }}-main"
        state: reloaded
